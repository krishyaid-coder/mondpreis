[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mondpreis"
version = "0.1.0"
description = "Verify advertised price reductions against observed price history (EU Omnibus Directive Art. 6a)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
mondpreis = "mondpreis.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mondpreis"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
